name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, tart]
    steps:
      - uses: actions/checkout@v4

      - name: Setup node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Check if dist/index.js needs to be rebuilt
        run: diff <(git status dist/index.js --short) <(echo -n "")

      - run: npm run format-check

      - run: npm run lint

      - run: npm test

  runSdkManager:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.platform.runner }}
    name: ${{ matrix.platform.name }} - ${{ matrix.cmdline-tools-version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64, tart]
          - name: linux-x64
            runner: [self-hosted, linux, x64]
          - name: windows-x64
            runner: [self-hosted, windows, x64]
        cmdline-tools-version:
          - 14742923
          - 13114758
          - 12700392
          - 12266719
          - 11479570
          - 11076708
          - 10406996
          - 9862592
          - 9477386
          - 9123335
          - 8512546
          - 8092744
          - 7583922
          - 7302050
          - 6858069
          - 6609375
          - 6200805

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Run setup-android
        uses: ./
        with:
          cmdline-tools-version: ${{ matrix.cmdline-tools-version }}
          log-accepted-android-sdk-licenses: 'false'
          # The obsolete tools package is absent on clean self-hosted images.
          packages: platform-tools

      - run: sdkmanager --list

  CI:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [checks, runSdkManager]
    runs-on: [self-hosted, macOS, ARM64, tart]
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
